# Elektromax – nginx ispred gunicorn-a. HTTPS dodaje certbot kada se poveže domen (vidi DEPLOY.md).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 5m;          # slike artikala do 4 MB
    server_tokens off;

    # slike koje se otpremaju kroz admin (van koda)
    location /static/uploads/ {
        alias /home/elektromax/data/uploads/;
        expires 30d;
        access_log off;
    }
    location /static/ {
        alias /home/elektromax/app/static/;
        expires 7d;
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
