<!doctype html>
<html lang="sr-Latn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ naslov }}</title>
<style>
  body{margin:0;padding:24px;background:#fff;color:#111}
  .str{max-width:820px;margin:0 auto;overflow-x:auto}
  .str>*{min-width:640px}
  @media (max-width:600px){body{padding:12px}}
  .str table{border-collapse:collapse}
  .alat{max-width:820px;margin:0 auto 16px}
  .alat button{font:600 14px "Segoe UI",Arial;padding:8px 14px;border-radius:8px;border:1px solid #ccc;background:#ffc21a;cursor:pointer}
  @media print{.alat{display:none} body{padding:0} .str{overflow:visible}}
</style></head><body>
<div class="alat"><button onclick="window.print()">Štampaj / sačuvaj kao PDF</button></div>
<div class="str">{{ html | safe }}</div>
</body></html>
